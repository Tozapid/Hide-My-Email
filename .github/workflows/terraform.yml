name: terraform

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# id-token lets the deploy jobs ask GitHub for an OIDC token, which AWS trades
# for the role in AWS_ROLE_ARN. There are no AWS keys in the repository.
permissions:
  contents: read

# One run at a time: Terraform also locks the state, this just avoids a queue of failed locks.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  TERRAFORM_VERSION: "1.16.3"
  STATE_KEY: Hide-My-Email/terraform.tfstate

jobs:
  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: terraform fmt
        run: terraform fmt -check -recursive
      - name: terraform validate
        run: |
          terraform init -backend=false
          terraform validate

  tests:
    name: Lambda tests and page syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Unit tests
        run: |
          pip install --quiet boto3
          cd lambda && python -m unittest -v hide_my_email_test reset_test
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: for f in web/*.js; do node --check "$f"; done

  plan:
    name: Plan
    needs: [terraform, tests]
    # Pull requests from forks get no token for the environment, so only this repository's branches are planned.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: demo
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: terraform init
        run: >
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=${{ env.STATE_KEY }}"
          -backend-config="region=${{ env.AWS_REGION }}"
      - name: terraform plan
        run: |
          terraform plan -lock=false -no-color -out=tfplan | tee plan.txt
          { echo '### Plan'; echo '```'; grep -E '^(Plan:|No changes)|^  # ' plan.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply
    needs: [terraform, tests]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: demo
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: terraform init
        run: >
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=${{ env.STATE_KEY }}"
          -backend-config="region=${{ env.AWS_REGION }}"
      - name: terraform plan
        run: |
          terraform plan -no-color -out=tfplan | tee plan.txt
          { echo '### Plan'; echo '```'; grep -E '^(Plan:|No changes)|^  # ' plan.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # A plan that would destroy a bucket, the table or the user pool needs a person, not CI.
      - name: Refuse to destroy data
        run: |
          if grep -E '^  # aws_(s3_bucket|dynamodb_table|cognito_user_pool)\.[a-z_]+ (will be destroyed|must be replaced)' plan.txt; then
            echo "::error::The plan destroys or replaces a bucket, the table or the user pool. Apply it by hand after checking."
            exit 1
          fi
      - name: terraform apply
        run: terraform apply -no-color tfplan
      - name: Site address
        run: |
          echo "Site: $(terraform output -json site_urls | jq -r '.[]')" >> "$GITHUB_STEP_SUMMARY"
